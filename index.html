/* Build 66 — hire & moving calculator */

/* Build 67 — calculator fits the page; save-town; waiting time */

.legend-dot.jt-collect{background:#be185d}.legend-dot.jt-house{background:#4d7c0f}.legend-dot.jt-other{background:#4b5563}

   minmax(0,1fr) lets a grid track shrink below its content; without it one long
